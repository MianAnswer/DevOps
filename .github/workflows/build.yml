name: Build Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --target base -t myapp .
      
      - name: Run image in container
        run: docker run -d --name myapp myapp

      - name: Stop container
        run: docker stop myapp && docker rm myapp
